name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libltdl-dev ffmpeg git
        pip install --upgrade pip
        pip install buildozer

    - name: Run Buildozer Compilation
      run: |
        buildozer android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Media-Downloader-APK
        path: bin/*.apk
