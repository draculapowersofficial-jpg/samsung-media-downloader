name: Build Android APK via Flet
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter Environment
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libgtk-3-dev

    - name: Install Flet and App Packages
      run: |
        pip install --upgrade pip
        pip install flet yt-dlp

    - name: Compile and Package APK
      run: |
        flet build apk --target-platform android-arm64

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Media-Downloader-APK
        path: build/apk/*.apk
